id: it-works-why
image_size: [500, 375]
urls:
  - src: imgflip
    url: https://i.imgflip.com/2hg8ef.jpg
font:
  family: Impact
  size: 36
  color: white
  stroke_color: black
  stroke_width: 3
  anchor: mm
layouts:
  - id: top-bottom
    default: true
    desc: "Classic top/bottom text"
    slots:
      - id: top
        role: "setup / the mystery"
        role_zh: "铺垫/谜团"
        pos: [250, 35]
      - id: bottom
        role: "punchline / don't touch"
        role_zh: "点睛/别碰"
        pos: [250, 345]
example:
  texts: ["It works", "Don't know why"]
