id: this-is-fine
image_size: [600, 286]
urls:
  - src: wikipedia
    url: https://upload.wikimedia.org/wikipedia/en/c/cb/This_is_fine_from_On_Fire_strip_by_KC_Green.jpg
  - src: imgflip
    url: https://i.imgflip.com/1d6t4m.jpg
font:
  family: Impact
  size: 40
  color: white
  stroke_color: black
  stroke_width: 3
  anchor: mm
layouts:
  - id: top-bottom
    default: true
    desc: "Classic top/bottom text format"
    slots:
      - id: top
        role: "setup / situation"
        role_zh: "铺垫/场景"
        pos: [300, 35]
      - id: bottom
        role: "punchline / denial"
        role_zh: "点睛/否认"
        pos: [300, 256]
example:
  texts: ["ERROR LOG", "THIS IS FINE"]
