# skill-quality.yml — Quality rules for awesome-meme skill
# Apply to: skill/ directory (SKILL.md, *.py, *.sh)

skill-no-data-in-skill:
  name: No template data in skill directory
  apply: "skill/"
  level: error
  desc:
  - The skill/ directory must only contain renderer code and documentation.
  - Never put meme_index.yml, template YAML, or image files inside skill/.
  - Data lives in data/ (meme_index.yml, data/spec/).
  - The skill fetches data from GitHub at runtime via meme ID.
  tldr:
  - wrong: "skill/data/ or data inside skill/"
    right: "data/spec/ and data/meme_index.yml in repo root"

skill-docs-split:
  name: Documentation split by topic, SKILL.md is entry point
  apply: "skill/SKILL.md"
  level: error
  desc:
  - SKILL.md must be concise: Get the Skill → Install → Usage → Options → How It Works → Doc links.
  - Detailed install instructions go in INSTALL.md.
  - Pillow-specific details go in PILLOW.md.
  - ImageMagick-specific details go in IMAGE_MAGICK.md.
  - SKILL.md links to these sub-docs, not inline all content.
  tldr:
  - wrong: "SKILL.md contains full Pillow/ImageMagick docs inline (100+ lines)"
    right: "SKILL.md has 50-60 lines with links to INSTALL.md, PILLOW.md, IMAGE_MAGICK.md"

skill-two-backends:
  name: Both Pillow and ImageMagick backends must be supported
  apply: "skill/meme_render.py, skill/meme_render.sh"
  level: error
  desc:
  - meme_render.py must support --backend pillow (default) and --backend magick.
  - meme_render.sh provides the shell/ImageMagick backend.
  - Both backends must handle the same template YAML format and produce consistent output.
  - Coordinate conversion between Pillow (center/mm) and ImageMagick (left-baseline) must be correct.
  - Both backends must handle CJK text with font fallback.
  tldr:
  - wrong: "Only Pillow supported, or magick backend broken"
    right: "Both backends produce correct output from the same template"

skill-meme-id-fetch:
  name: Renderer supports meme ID auto-fetch from GitHub
  apply: "skill/meme_render.py, skill/meme_render.sh"
  level: error
  desc:
  - Both meme_render.py and meme_render.sh must accept a meme ID (e.g. distracted-boyfriend).
  - When given a meme ID (not a file path), fetch the template YAML from GitHub.
  - When given a local file path, read directly.
  - Both scripts must try hyphen and underscore variants of the meme ID.
  tldr:
  - wrong: "Only accepts local file paths"
    right: "meme_render.py distracted-boyfriend TEXT1 TEXT2 and meme_render.sh distracted-boyfriend TEXT1 TEXT2 both work"

skill-get-the-skill-section:
  name: SKILL.md explains how to download the skill
  apply: "skill/SKILL.md"
  level: warn
  desc:
  - SKILL.md must have a "Get the Skill" section explaining how to obtain the renderer.
  - Should cover: git clone, curl single file, and x-cmd (if available).
  - If mentioning x-cmd, include install link: https://www.x-cmd.com/llms.txt
  tldr:
  - wrong: "SKILL.md starts with Usage but no download instructions"
    right: "SKILL.md has Get the Skill section with git clone / curl / x-cmd options"

skill-cjk-font-fallback:
  name: CJK font fallback works on all platforms
  apply: "skill/meme_render.py"
  level: error
  desc:
  - The renderer must support CJK text on both macOS and Linux.
  - CJK_FONT_PATHS must include Linux paths (e.g. /usr/share/fonts/opentype/noto/).
  - Both Pillow and ImageMagick backends must handle CJK text (not just Pillow).
  - If one backend lacks CJK support, document the limitation in SKILL.md.
  tldr:
  - wrong: "CJK_FONT_PATHS only has macOS paths; magick backend ignores CJK"
    right: "Both platforms and both backends handle CJK text correctly"

skill-docs-code-consistency:
  name: Documentation matches actual code behavior
  apply: "skill/"
  level: error
  desc:
  - Default values in docs must match code (--layout default, --backend default, etc.).
  - Referenced files must exist (e.g. meme_render.sh must exist if mentioned).
  - Spec naming convention must be consistent (either all hyphens or all underscores, not mixed).
  - AGENTS.md data paths must match actual directory structure.
  tldr:
  - wrong: "Docs say --layout defaults to chest-label but code defaults to None"
    right: "Docs and code agree on all defaults and file paths"

skill-font-selection-guide:
  name: Font selection guide for callers
  apply: "skill/SKILL.md"
  level: warn
  desc:
  - SKILL.md must explain font behavior so callers (AI agents) can make informed decisions.
  - Must cover: English (Impact/Anton), CJK (system fonts), mixed text handling.
  - Must state clearly that Impact has no CJK glyphs — Chinese text will be invisible.
  - Must explain auto-detection behavior and how to override via spec YAML.
  tldr:
  - wrong: "Font info buried in renderer docs, caller doesn't know about CJK issue"
    right: "SKILL.md has font selection section visible to callers"

skill-spec-naming:
  name: Spec file naming convention is consistent
  apply: "data/spec/"
  level: warn
  desc:
  - Spec YAML files should use a consistent naming convention.
  - Prefer underscores (e.g. distracted_boyfriend.yml) since that matches the repo convention.
  - The renderer auto-resolves both hyphen and underscore variants, but the files themselves should be consistent.
  tldr:
  - wrong: "Mix of distracted-boyfriend.yml and distracted_boyfriend.yml in spec/"
    right: "All spec files use underscores: distracted_boyfriend.yml"
