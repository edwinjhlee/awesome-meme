# skill-quality.yml — Quality rules for awesome-meme skill
# Apply to: skill/ directory (SKILL.md, *.py, *.sh)

skill-no-data-in-skill:
  name: No template data in skill directory
  apply: "skill/"
  level: error
  desc:
  - The skill/ directory must only contain renderer code and documentation.
  - Never put meme_index.yml, template YAML, or image files inside skill/.
  - Data lives in data/ (meme_index.yml, data/spec/).
  - The skill fetches data from GitHub at runtime via meme ID.
  tldr:
  - wrong: "skill/data/ or data inside skill/"
    right: "data/spec/ and data/meme_index.yml in repo root"

skill-docs-split:
  name: Documentation split by topic, SKILL.md is entry point
  apply: "skill/SKILL.md"
  level: error
  desc:
  - SKILL.md must be concise (~80 lines max): Quick Start → Options → Font selection → Backends → Get the Skill → How It Works → Docs.
  - Detailed install instructions go in INSTALL.md.
  - Pillow-specific details go in PILLOW.md.
  - ImageMagick-specific details go in IMAGE_MAGICK.md.
  - AI agent usage guidelines go in GUIDELINES.md.
  - SKILL.md links to these sub-docs, not inline all content.
  tldr:
  - wrong: "SKILL.md contains full Pillow/ImageMagick/Guidelines docs inline (100+ lines)"
    right: "SKILL.md is ~80 lines with links to INSTALL.md, PILLOW.md, IMAGE_MAGICK.md, GUIDELINES.md"

skill-two-backends:
  name: Both Pillow and ImageMagick backends must be supported
  apply: "skill/meme_render.py, skill/meme_render.sh"
  level: error
  desc:
  - meme_render.py must support --backend pillow (default) and --backend magick.
  - meme_render.sh provides the shell/ImageMagick backend.
  - Both backends must handle the same template YAML format and produce consistent output.
  - Both backends must correctly parse nested YAML: font config under `font:` key, slots under `layouts:` → `slots:`.
  - Both backends must handle CJK text with font fallback.
  - The shell script must NOT use simple `grep "^key:"` for nested YAML — use sed/awk to parse blocks.
  tldr:
  - wrong: "Only Pillow supported, or shell script ignores nested YAML font/slot config"
    right: "Both backends parse the same template YAML correctly and produce consistent output"

skill-meme-id-fetch:
  name: Renderer supports meme ID auto-fetch from GitHub
  apply: "skill/meme_render.py, skill/meme_render.sh"
  level: error
  desc:
  - Both meme_render.py and meme_render.sh must accept a meme ID (e.g. distracted-boyfriend).
  - When given a meme ID (not a file path), fetch the template YAML from GitHub.
  - When given a local file path, read directly.
  - Both scripts must try hyphen and underscore variants of the meme ID.
  tldr:
  - wrong: "Only accepts local file paths"
    right: "meme_render.py distracted-boyfriend TEXT and meme_render.sh distracted-boyfriend TEXT both work"

skill-get-the-skill-section:
  name: SKILL.md explains how to download the skill
  apply: "skill/SKILL.md"
  level: warn
  desc:
  - SKILL.md must have a "Get the Skill" section explaining how to obtain the renderer.
  - Should cover: git clone, curl single file, and x-cmd (if available).
  - If mentioning x-cmd, include install link: https://www.x-cmd.com/llms.txt
  tldr:
  - wrong: "SKILL.md starts with Usage but no download instructions"
    right: "SKILL.md has Get the Skill section with git clone / curl / x-cmd options"

skill-cjk-font-fallback:
  name: CJK font fallback works on all platforms and both backends
  apply: "skill/meme_render.py, skill/meme_render.sh"
  level: error
  desc:
  - Both meme_render.py and meme_render.sh must have CJK_FONT_PATHS with both macOS and Linux paths.
  - CJK_FONT_PATHS in the shell script must include the same Linux paths as the Python script (Noto Sans CJK, WenQuanYi).
  - Both Pillow and ImageMagick backends must handle CJK text (not just Pillow).
  - If one backend lacks CJK support, document the limitation in SKILL.md.
  - Both scripts must have a _has_cjk / has_cjk function that checks CJK Unicode ranges.
  tldr:
  - wrong: "CJK_FONT_PATHS only has macOS paths; shell script missing CJK detection"
    right: "Both platforms and both backends (Python + Shell) handle CJK text correctly"

skill-docs-code-consistency:
  name: Documentation matches actual code behavior
  apply: "skill/"
  level: error
  desc:
  - Default values in docs must match code (--layout default, --backend default, etc.).
  - Referenced files must exist (e.g. meme_render.sh must exist if mentioned).
  - Spec naming convention must be consistent (either all hyphens or all underscores, not mixed).
  - AGENTS.md data paths must match actual directory structure (data/text/{zh,en}/ not data/text/).
  - Options tables must match what the scripts actually parse (no documenting unsupported flags).
  - Usage comments in scripts must match actual argument parsing.
  tldr:
  - wrong: "Docs say --layout defaults to chest-label but code defaults to None"
    right: "Docs and code agree on all defaults, file paths, and supported options"

skill-font-selection-guide:
  name: Font selection guide for callers
  apply: "skill/SKILL.md"
  level: warn
  desc:
  - SKILL.md must explain font behavior so callers (AI agents) can make informed decisions.
  - Must cover: English (Impact/Anton), CJK (system fonts), mixed text handling.
  - Must state clearly that Impact has no CJK glyphs — Chinese text will be invisible.
  - Must explain auto-detection behavior and how to override via spec YAML.
  tldr:
  - wrong: "Font info buried in renderer docs, caller doesn't know about CJK issue"
    right: "SKILL.md has font selection section visible to callers"

skill-spec-naming:
  name: Spec file naming convention is consistent
  apply: "data/spec/"
  level: warn
  desc:
  - Spec YAML files should use a consistent naming convention.
  - Prefer underscores (e.g. distracted_boyfriend.yml) since that matches the repo convention.
  - The renderer auto-resolves both hyphen and underscore variants, but the files themselves should be consistent.
  tldr:
  - wrong: "Mix of distracted-boyfriend.yml and distracted_boyfriend.yml in spec/"
    right: "All spec files use underscores: distracted_boyfriend.yml"

skill-yaml-parse-correctness:
  name: Shell script correctly parses nested YAML
  apply: "skill/meme_render.sh"
  level: error
  desc:
  - The shell script must correctly parse the spec YAML format.
  - Font config is nested under `font:` key — reading `family:` requires parsing the font block, not grepping top-level.
  - Slot positions are under `layouts:` → first layout → `slots:` → `- pos: [x, y]`.
  - Using `grep "^key:"` at top level will miss all nested keys — use `sed -n '/^font:/,/^[^ ]/p'` or awk.
  - Test: verify the shell script reads font size and slot positions from a real spec file correctly.
  tldr:
  - wrong: "Shell script uses grep '^family:' which misses indented nested keys"
    right: "Shell script uses sed/awk to correctly parse font block and layout/slot positions"

skill-docs-cross-references:
  name: All doc cross-references are valid
  apply: "skill/"
  level: warn
  desc:
  - Every doc file linked from SKILL.md must exist in skill/ directory.
  - If GUIDELINES.md exists, SKILL.md must link to it in the Docs section.
  - If GUIDELINES.md exists, AGENTS.md must mention it in the architecture tree.
  - No broken or stale links between docs.
  tldr:
  - wrong: "SKILL.md links to GUIDELINES.md but AGENTS.md doesn't list it"
    right: "All cross-references between SKILL.md, AGENTS.md, and sub-docs are consistent"

data-index-spec-sync:
  name: Index, spec files, and TSV must be in sync
  apply: "data/"
  level: error
  desc:
  - Every meme ID in data/index.yml must have a corresponding spec file in data/spec/{id}.yml.
  - Every spec file in data/spec/ must have a matching entry in data/index.yml (except text-only memes which live in data/text/).
  - data/index.tsv must be regenerated from data/index.yml (YML is source of truth).
  - Text memes in data/text/{zh,en}/ should NOT appear in data/index.yml (they are a separate system).
  - README.md meme table must reflect the current contents of data/index.yml and data/text/.
  - CONTRIBUTING.md must reference correct file names (data/index.yml, not stale names).
  - Spec file naming must use underscores (distracted_boyfriend.yml), matching the id field (which may use hyphens in index).
  tldr:
  - wrong: "13 spec files exist but have no index entry; index.tsv is outdated with only 20 entries"
    right: "Every image meme has both index.yml entry and spec file; index.tsv is regenerated; README table is current"
